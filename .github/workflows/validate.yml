name: Validate data and methodology
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true
      - name: Restore exact dependency versions
        run: Rscript -e 'renv::restore(prompt = FALSE, strict = TRUE, transactional = TRUE, retry = FALSE)'
      - name: Check environment
        run: Rscript -e 'stopifnot(renv::status()$synchronized)'
      - name: Check method and full project representation
        run: Rscript tests/method.R
      - name: Check all inputs and map areas
        run: Rscript scripts/pipeline.R check
      - name: Build one complete preview
        run: Rscript scripts/pipeline.R build --output=/tmp/datacenters-preview.json
