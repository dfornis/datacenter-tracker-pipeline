name: Validate data and methodology
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true
      - name: Restore exact dependency versions
        run: Rscript -e 'renv::restore(prompt = FALSE, strict = TRUE, transactional = TRUE, retry = FALSE)'
      - name: Check environment
        run: Rscript -e 'stopifnot(renv::status()$synchronized)'
      - name: Run regression and complete-export checks
        run: Rscript tests/run_tests.R
      - name: Validate selected data release
        if: ${{ hashFiles('data/current/manifest.json') != '' }}
        run: Rscript scripts/validate_data.R
      - name: Build selected release without publishing
        if: ${{ hashFiles('data/current/manifest.json') != '' }}
        run: Rscript scripts/build_datacenter_data.R --output-dir=/tmp/datacenter-ci-export
